version: "3.9"

# The api service is fully self-contained today: the trained model is
# baked into the image at build time (see Dockerfile) and live user
# profiles are a JSON file, not a database. postgres/redis below are
# the target production architecture documented in Phase 1 (a real
# star-schema store, shared session cache across multiple workers) -
# nothing in the code connects to either one yet, so they're commented
# out by default rather than adding two services the demo doesn't need.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
